<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ХимСклад Pro - Вход</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="dark-body">
    <div class="login-wrapper">
        <div class="login-panel glass-panel">
            <div class="login-brand">
                <span class="brand-dot"></span>
                <span class="brand-name">ХимСклад<span class="brand-accent"> Pro</span></span>
            </div>
            <h2 class="login-title">Вход в систему</h2>
            <p class="login-subtitle">Панель учета химии для агрохолдинга</p>

            <form id="loginForm" class="login-form">
                <label>Логин</label>
                <input type="text" id="username" placeholder="Введите логин" required>

                <label>Пароль</label>
                <input type="password" id="password" placeholder="Введите пароль" required>

                <button type="submit" class="btn btn-primary">Войти</button>
            </form>

            <div id="loginError" class="alert alert-error hidden">
                Неверный логин или пароль
            </div>

            <div class="login-footer">
                <span class="role-pill">Создатель: <b>admin / admin123</b></span>
            </div>
        </div>
    </div>
    <script src="login.js"></script>
</body>
</html>
